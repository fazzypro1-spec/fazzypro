<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#A6DC1C" />
<meta name="description" content="O serviço que você pede, a gente resolve. Peça qualquer serviço, receba propostas de profissionais e feche pelo chat." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FazzyPro" />
<!-- single-file: manifest removido --><link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<title>FazzyPro — O serviço que você pede, a gente resolve</title>
<style>
  :root{
    --bg:#05060A; --bg2:#0B0F06; --surface:#10160A; --surface2:#161E0D; --surface3:#1C250F;
    --line:#242D15; --line2:#303A1D;
    --lime:#A6DC1C; --lime2:#C4F03C; --lime-dark:#83B90F; --lime-soft:#1B2508;
    --text:#F2F4EC; --muted:#A6AF92; --soft:#6D7560;
    --danger:#FF5A5A; --ok:#5FDB3A; --info:#54A9FF; --warn:#FFC53D;
    --radius:20px; --shadow:0 14px 40px rgba(0,0,0,.45);
    --ring:0 0 0 3px rgba(166,220,28,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);background:var(--bg);
    background-image:radial-gradient(120% 90% at 100% 0%, rgba(166,220,28,.06), transparent 45%),
                     radial-gradient(120% 90% at 0% 100%, rgba(166,220,28,.05), transparent 45%);
    -webkit-font-smoothing:antialiased;line-height:1.45;
  }
  a{color:inherit;text-decoration:none}
  /* segurança: nenhum ícone SVG pode exceder o contêiner ou estourar de tamanho */
  svg{max-width:100%;max-height:100%;vertical-align:middle}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}
  img{max-width:100%;display:block}

  .app{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  /* ===== TOPBAR ===== */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(6,8,11,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:-.6px;font-style:italic;line-height:1;cursor:pointer}
  .brand .emblem{width:40px;height:40px;flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(166,220,28,.25))}
  .brand .emblem svg{width:100%;height:100%;display:block}
  .brand em{color:var(--lime);font-style:italic;margin-left:-2px}
  .brand small{display:block;font-size:8.5px;font-style:normal;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-top:1px}
  .topright{margin-left:auto;display:flex;align-items:center;gap:10px}

  .roleswitch{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:14px}
  .roleswitch button{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted);transition:.15s}
  .roleswitch button svg{width:16px;height:16px}
  .roleswitch button.active{background:linear-gradient(135deg,var(--lime),var(--lime2));color:#10150A;box-shadow:0 4px 14px rgba(166,220,28,.25)}

  .bell{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);position:relative;transition:.15s}
  .bell:hover{border-color:var(--lime);color:var(--lime)}
  .bell svg{width:18px;height:18px}
  .bell .bdg{position:absolute;top:-3px;right:-3px;background:var(--lime);color:#10150A;font-size:9px;font-weight:800;line-height:1;min-width:14px;height:14px;border-radius:999px;display:grid;place-items:center;padding:0 3px;box-shadow:0 1px 4px rgba(166,220,28,.4)}

  /* avatar / account menu */
  .account-wrap{position:relative}
  .avatar{width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--lime);font-size:14px;cursor:pointer;transition:.15s}
  .avatar:hover{border-color:var(--lime)}
  .avatar small{font-size:7px;color:var(--soft);font-weight:800;text-transform:uppercase;letter-spacing:.4px}

  /* dropdowns */
  .dropdown{position:absolute;right:0;top:48px;z-index:100;width:min(320px,90vw);background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:pop .16s ease}
  .dropdown .dd-scroll{max-height:min(58vh,420px);overflow-y:auto}
  .dropdown .dd-scroll::-webkit-scrollbar{width:6px}
  .dropdown .dd-scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .dropdown .dd-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .dropdown .dd-head b{font-size:14px}
  .dropdown .dd-head button{color:var(--lime);font-size:12px;font-weight:700}
  .notif{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
  .notif:last-child{border-bottom:none}
  .notif .ni{width:36px;height:36px;border-radius:11px;background:var(--lime-soft);border:1px solid var(--line);display:grid;place-items:center;color:var(--lime);flex:0 0 auto}
  .notif .ni svg{width:18px;height:18px}
  .notif p{font-size:13.5px;line-height:1.35}
  .notif time{font-size:11px;color:var(--soft);display:block;margin-top:3px}
  .notif.unread{background:rgba(166,220,28,.05)}
  .notif.unread p{font-weight:700}
  .dd-empty{text-align:center;color:var(--soft);padding:28px 16px;font-size:13.5px}

  .menuitem{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:600;transition:.12s}
  .menuitem:last-child{border-bottom:none}
  .menuitem:hover{background:var(--surface2)}
  .menuitem .mi{width:34px;height:34px;border-radius:10px;background:var(--surface3);border:1px solid var(--line);display:grid;place-items:center;color:var(--lime)}
  .menuitem .mi svg{width:17px;height:17px}
  .menuitem.danger{color:var(--danger)}
  .menuitem.danger .mi{color:var(--danger)}

  /* bottom nav */
  .bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(8,10,12,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--soft);padding:6px 0}
  .bottomnav button svg{width:22px;height:22px}
  .bottomnav button.active{color:var(--lime)}
  .bottomnav button .bdg{position:absolute;top:2px;right:calc(50% - 20px);background:var(--lime);color:#10150A;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:999px;display:grid;place-items:center;padding:0 3px}

  .content{flex:1;padding:18px 20px 120px;max-width:1180px;margin:0 auto;width:100%}
  .content.no-nav{padding-bottom:40px}

  /* ===== LOGIN ===== */
  .login-wrap{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:26px 18px}
  .login-box{width:min(680px,96vw)}
  .login-brand{text-align:center;margin-bottom:26px}
  .login-brand .emblem{width:78px;height:78px;margin:0 auto 14px;filter:drop-shadow(0 8px 20px rgba(166,220,28,.3))}
  .login-brand .emblem svg{width:100%;height:100%}
  .login-brand h1{font-size:34px;font-weight:900;font-style:italic;letter-spacing:-.6px}
  .login-brand h1 em{color:var(--lime)}
  .login-brand p{color:var(--muted);font-size:14px;margin-top:6px;letter-spacing:.4px}
  .logincards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .rolecard{background:var(--surface);border:1px solid var(--line2);border-radius:22px;padding:24px;cursor:pointer;transition:.16s;text-align:center;position:relative;overflow:hidden}
  .rolecard:hover{transform:translateY(-4px);border-color:var(--lime);box-shadow:var(--shadow)}
  .rolecard .big{width:60px;height:60px;border-radius:18px;background:var(--lime-soft);border:1px solid var(--line);display:grid;place-items:center;color:var(--lime);margin:0 auto 14px}
  .rolecard .big svg{width:30px;height:30px}
  .rolecard h3{font-size:18px;font-weight:900}
  .rolecard p{color:var(--muted);font-size:13px;margin:6px 0 16px;line-height:1.4}
  .rolecard .cta{background:linear-gradient(135deg,var(--lime),var(--lime2));color:#10150A;font-weight:800;font-size:14px;padding:12px;border-radius:12px}
  .login-note{margin-top:18px;text-align:center;color:var(--soft);font-size:12.5px}
  .login-note b{color:var(--lime)}

  /* ===== HERO ===== */
  .hero{background:linear-gradient(135deg,#12190a 0%,#0b1006 100%);border:1px solid var(--line2);border-radius:26px;padding:28px 26px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-60px;top:-70px;width:260px;height:260px;background:radial-gradient(circle,rgba(166,220,28,.14),transparent 70%);border-radius:50%}
  .hero .eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--lime-soft);border:1px solid var(--lime);color:var(--lime2);font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.6px;position:relative;z-index:2}
  .hero .eyebrow svg{width:15px;height:15px}
  .hero h1{font-size:30px;font-weight:900;letter-spacing:-.6px;margin:16px 0 8px;position:relative;z-index:2;line-height:1.08}
  .hero h1 em{color:var(--lime);font-style:italic}
  .hero p{color:var(--muted);font-size:15.5px;max-width:560px;position:relative;z-index:2}
  .hero .hnote{margin-top:12px;color:var(--muted);font-size:13px;position:relative;z-index:2;display:flex;align-items:center;gap:6px}
  .hero .hnote svg{width:16px;height:16px;flex:0 0 auto;color:var(--lime)}
  .searchbar{margin-top:22px;display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line2);border-radius:14px;padding:4px 4px 4px 16px;max-width:600px;position:relative;z-index:2}
  .searchbar svg{width:20px;height:20px;color:var(--soft);flex:0 0 auto}
  .searchbar input{flex:1;border:none;outline:none;background:transparent;font-size:15.5px;color:var(--text);padding:12px 0}
  .searchbar input::placeholder{color:var(--soft)}
  .searchbar button{background:var(--lime);color:#10150A;font-weight:800;font-size:14px;padding:12px 20px;border-radius:11px;flex:0 0 auto}
  .searchbar button:hover{background:var(--lime2)}

  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;position:relative;z-index:2}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
  .stat b{font-size:22px;font-weight:900;color:var(--lime)}
  .stat span{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-top:2px}
  .stat .ic{width:32px;height:32px;border-radius:9px;background:var(--lime-soft);display:grid;place-items:center;color:var(--lime);margin-bottom:8px}
  .stat .ic svg{width:18px;height:18px}

  .section{margin-top:30px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
  .sec-head h2{font-size:19px;font-weight:900;letter-spacing:-.3px}
  .sec-head a{color:var(--lime);font-weight:800;font-size:14px}
  .sec-head a:hover{color:var(--lime2)}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:flex-start}
  .step .n{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--lime),var(--lime2));color:#10150A;font-weight:900;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
  .step b{font-size:14.5px;display:block;margin-bottom:3px}
  .step span{font-size:12.5px;color:var(--muted);line-height:1.35}

  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 12px;display:flex;flex-direction:column;align-items:center;gap:11px;transition:.15s;cursor:pointer;text-align:center}
  .chip:hover{transform:translateY(-3px);border-color:var(--lime);background:var(--surface2)}
  .chip .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--lime-soft);border:1px solid var(--line);color:var(--lime)}
  .chip .ic svg{width:26px;height:26px}
  .chip b{font-size:13px;font-weight:800;line-height:1.15}
  .chip small{color:var(--soft);font-size:11px;font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:.16s;cursor:pointer;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px);border-color:#3a4a1e;box-shadow:var(--shadow)}
  .card .banner{height:104px;position:relative;display:grid;place-items:center;background:linear-gradient(135deg,#141b08,#1a2410);border-bottom:1px solid var(--line)}
  .card .banner svg{width:42px;height:42px;color:var(--lime)}
  .card .banner .tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.35);color:var(--text);font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line2)}
  .card .banner .ver{position:absolute;top:10px;right:10px;background:var(--lime);color:#10150A;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;display:flex;align-items:center;gap:4px}
  .card .banner .ver svg{width:12px;height:12px}
  .card .body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card h3{font-size:16px;font-weight:900;letter-spacing:-.2px}
  .card .desc{font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap}
  .card .meta .star{color:var(--warn);font-weight:800;display:inline-flex;align-items:center;gap:3px}
  .card .meta .star svg{width:14px;height:14px}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px}
  .card .tags span{background:var(--surface3);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px}
  .card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid var(--line)}
  .card .price{font-size:12.5px;color:var(--muted);font-weight:600}
  .card .price b{color:var(--text);font-size:16px;font-weight:900}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;border-radius:13px;padding:13px 22px;font-size:15px;transition:.15s}
  .btn.lime{background:linear-gradient(135deg,var(--lime),var(--lime2));color:#10150A}
  .btn.lime:hover{filter:brightness(1.05)}
  .btn.ghost{background:var(--surface2);border:1.5px solid var(--line2);color:var(--text)}
  .btn.ghost:hover{border-color:var(--lime);color:var(--lime)}
  .btn.outline-lime{background:transparent;border:1.5px solid var(--lime);color:var(--lime)}
  .btn.outline-lime:hover{background:var(--lime-soft)}
  .btn.sm{padding:9px 16px;font-size:13.5px;border-radius:11px}
  .btn.block{width:100%}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 8px 26px rgba(0,0,0,.25);margin-bottom:16px}
  .panel h3{font-size:17px;font-weight:900;margin-bottom:15px}

  .reqitem{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .reqitem .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .reqitem .cat{display:inline-flex;align-items:center;gap:6px;background:var(--lime-soft);border:1px solid var(--line);color:var(--lime);font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px}
  .reqitem .cat svg{width:14px;height:14px}
  .reqitem h3{font-size:17px;margin-bottom:4px}
  .reqitem .desc{color:var(--muted);font-size:14px;margin-bottom:12px}
  .reqitem .meta{display:flex;gap:16px;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap}
  .reqitem .meta span{display:inline-flex;align-items:center;gap:5px}
  .reqitem .meta svg{width:15px;height:15px}

  .badge-status{font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px}
  .badge-status.aguardando{background:rgba(255,197,61,.12);color:var(--warn)}
  .badge-status.em_andamento{background:rgba(84,169,255,.12);color:var(--info)}
  .badge-status.aceita{background:rgba(95,219,58,.12);color:var(--ok)}
  .badge-status.recusada{background:rgba(255,90,90,.12);color:var(--danger)}
  .badge-status.concluida{background:rgba(95,219,58,.14);color:var(--ok)}

  .prop{display:flex;gap:14px;padding:14px;border:1px solid var(--line);border-radius:15px;margin-bottom:10px;background:var(--surface2)}
  .prop .pa{width:46px;height:46px;border-radius:13px;background:var(--surface3);border:1px solid var(--line2);display:grid;place-items:center;color:var(--lime);font-weight:900;font-size:16px;flex:0 0 auto}
  .prop .info{flex:1}
  .prop .info b{font-size:15px;display:block}
  .prop .info .row{display:flex;gap:10px;font-size:12.5px;color:var(--muted);font-weight:600;align-items:center;flex-wrap:wrap}
  .prop .info .row .st{color:var(--warn);display:inline-flex;align-items:center;gap:3px;font-weight:800}
  .prop .info .row .st svg{width:13px;height:13px}
  .prop .msg{font-size:13px;color:var(--muted);background:var(--surface3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
  .prop .amount{font-size:20px;font-weight:900;color:var(--lime);white-space:nowrap}
  .prop .actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:center;min-width:104px}

  .modal-bg{position:fixed;inset:0;z-index:120;background:rgba(2,3,5,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px}
  .modal{background:var(--surface);border:1px solid var(--line2);border-radius:22px;padding:22px;width:min(480px,92vw);box-shadow:var(--shadow);max-height:90vh;overflow:auto}
  .modal h3{font-size:19px;margin-bottom:6px}
  .modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  .field input,.field textarea,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line2);border-radius:13px;font-size:15px;color:var(--text);background:var(--surface2);outline:none}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--lime);box-shadow:var(--ring)}
  .field textarea{resize:vertical;min-height:80px}
  .field select option{background:var(--surface2);color:var(--text)}
  .field .hint{font-size:11.5px;color:var(--soft);margin-top:5px}
  .formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* payment / checkout */
  .pay-methods{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .pay{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line2);border-radius:14px;cursor:pointer;transition:.13s}
  .pay:hover{border-color:var(--lime)}
  .pay.selected{border-color:var(--lime);background:var(--lime-soft)}
  .pay .ic{width:40px;height:40px;border-radius:11px;background:var(--surface3);display:grid;place-items:center;color:var(--lime)}
  .pay .ic svg{width:20px;height:20px}
  .pay b{font-size:14.5px;display:block}
  .pay span{font-size:12px;color:var(--muted)}
  .pay .radio{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center}
  .pay.selected .radio{border-color:var(--lime)}
  .pay.selected .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--lime)}
  .feetails{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
  .feetails .fl{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:8px}
  .feetails .fl.total{font-size:18px;font-weight:900;color:var(--text);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
  .feetails .fl.total b{color:var(--lime)}

  /* verification panel */
  .verifyhero{background:linear-gradient(135deg,#12190a,#0b1006);border:1px solid var(--line2);border-radius:22px;padding:24px;display:flex;align-items:center;gap:18px;margin-bottom:16px}
  .verifyhero .badge{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--lime),var(--lime2));display:grid;place-items:center;color:#10150A;flex:0 0 auto}
  .verifyhero .badge svg{width:30px;height:30px}
  .verifyhero h2{font-size:20px;font-weight:900}
  .verifyhero p{color:var(--muted);font-size:13.5px;margin-top:4px}
  .verifyhero .lvl{display:inline-flex;align-items:center;gap:5px;background:var(--lime-soft);border:1px solid var(--lime);color:var(--lime);font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;margin-top:8px}
  .vitem{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--surface);border:1px solid var(--line);border-radius:15px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .vitem .vi{width:42px;height:42px;border-radius:12px;background:var(--surface3);display:grid;place-items:center;color:var(--lime);flex:0 0 auto}
  .vitem .vi svg{width:21px;height:21px}
  .vitem b{font-size:15px;display:block}
  .vitem span{font-size:13px;color:var(--muted)}
  .vitem .st{margin-left:auto;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px}
  .vitem .st.ok{background:rgba(95,219,58,.12);color:var(--ok)}
  .vitem .st.wait{background:rgba(255,197,61,.12);color:var(--warn)}
  .vitem .st.none{background:rgba(255,90,90,.12);color:var(--danger)}

  .chatlist{display:flex;flex-direction:column;gap:10px}
  .conv{display:flex;gap:13px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:.14s}
  .conv:hover{border-color:#3a4a1e}
  .conv .ca{width:46px;height:46px;border-radius:14px;background:var(--surface3);border:1px solid var(--line2);display:grid;place-items:center;color:var(--lime);font-weight:900;font-size:16px;flex:0 0 auto;position:relative}
  .conv .ca .unread{position:absolute;top:-5px;right:-5px;background:var(--lime);color:#10150A;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center}
  .conv .info{flex:1;min-width:0}
  .conv .info b{font-size:15px;display:block}
  .conv .info .last{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .time{font-size:11.5px;color:var(--soft);white-space:nowrap}

  .chatroom{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:420px}
  .chatroom .head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .chatroom .head .ca{width:44px;height:44px;border-radius:13px;background:var(--surface3);border:1px solid var(--line2);display:grid;place-items:center;color:var(--lime);font-weight:900;font-size:16px}
  .chatroom .head b{font-size:16px;display:block}
  .chatroom .head small{color:var(--muted);font-size:12.5px}
  .chatroom .head .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px}
  .messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:4px 2px 12px}
  .msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.4;position:relative;word-wrap:break-word}
  .msg.them{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.mine{align-self:flex-end;background:linear-gradient(135deg,var(--lime),var(--lime2));color:#10150A;border-bottom-right-radius:4px}
  .msg .t{display:block;font-size:10px;opacity:.65;margin-top:4px;font-weight:700}
  .chatinput{display:flex;gap:10px;margin-top:12px}
  .chatinput input{flex:1;background:var(--surface2);border:1px solid var(--line2);border-radius:14px;padding:13px 15px;font-size:15px;color:var(--text);outline:none}
  .chatinput input:focus{border-color:var(--lime);box-shadow:var(--ring)}

  .chatinput button:hover{background:var(--lime2)}

  .backbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}

  .backbar button:hover{border-color:var(--lime);color:var(--lime)}
  .backbar button svg{width:20px;height:20px}
  .backbar h2{font-size:18px;font-weight:900}
  .backbar .sub{color:var(--muted);font-size:13px}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty svg{width:52px;height:52px;color:var(--soft);margin-bottom:12px}
  .empty b{display:block;font-size:17px;color:var(--text);margin-bottom:4px}

  .install-banner{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow);animation:pop .2s ease}

  .install-banner .t b{color:var(--text)}

  .ai-box .ai-head span{font-size:12px;color:var(--muted);display:block}

  .ai-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;position:relative;z-index:2}

  .ai-tag.danger{background:rgba(255,90,90,.12);border-color:rgba(255,90,90,.3);color:var(--danger)}
  .ai-tag.neutral{background:var(--surface2);color:var(--muted)}

  .ai-match .score small{display:block;font-size:10px;color:var(--soft)}

  .spinner{width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--lime);border-radius:50%;animation:spin .8s linear infinite}

  .rec-badge{background:var(--lime);color:#10150A;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}

  .rec-badge svg{width:11px;height:11px}
  .cmp{font-size:12px;color:var(--muted);background:var(--surface3);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%;margin-top:8px}

  @media(max-width:760px){ .ai-fields{grid-template-columns:1fr} .ph-grid{grid-template-columns:repeat(3,1fr)} }

  .toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:220;display:flex;flex-direction:column;gap:10px;width:min(92vw,400px)}
  .toast{background:#151a0b;color:var(--text);padding:13px 18px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:var(--shadow);border:1px solid var(--line2);display:flex;align-items:center;gap:10px;animation:slide .25s ease}
  .toast svg{width:18px;height:18px;color:var(--lime);flex:0 0 auto}
  @keyframes slide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

  .pill-tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:18px;overflow:auto}
  .pill-tabs button{flex:1;padding:11px;border-radius:11px;font-weight:800;font-size:13.5px;color:var(--muted);white-space:nowrap}
  .pill-tabs button.active{background:linear-gradient(135deg,var(--lime),var(--lime2));color:#10150A}

  footer{margin-top:30px;text-align:center;color:var(--soft);font-size:12.5px;padding:20px 0}
  footer b{color:var(--lime)}

  @media(max-width:760px){
    .content{padding:14px 14px 112px;max-width:100%}
    .hero h1{font-size:24px}
    .hero{padding:22px 18px}
    .chips{grid-template-columns:repeat(3,1fr)}
    .steps{grid-template-columns:1fr}
    .statgrid{grid-template-columns:repeat(2,1fr)}
    .brand small{display:none}
    .roleswitch button{padding:9px 9px;font-size:12px}
    .roleswitch button svg{width:15px;height:15px}
    .topbar .avatar{display:none}
    .logincards{grid-template-columns:1fr}
    .login-brand h1{font-size:28px}
    .formrow{grid-template-columns:1fr}
  }
</style>
</head>

/* =====================================================================
   MOTOR DE IA (interpreta texto + fotos, estrutura, classifica, casa e compara)
   Demonstração determinística — roda offline. Em produção: modelo de IA real.
   ===================================================================== */
const PHOTO_TAGS = {
  'sample-pia.jpg':{cat:'hidraulica',label:'provável vazamento'},
  'sample-luminaria.jpg':{cat:'eletrica',label:'instalação elétrica/luminária'},
  'sample-guarda-roupa.jpg':{cat:'montagem',label:'montagem de móvel'}
};

function aiDetectKeywords(text){
  const t=(text||'').toLowerCase();
  let scores={};
  Object.keys(AI_LANG).forEach(id=>{ const k=AI_LANG[id].kw; let s=0; k.forEach(w=>{ if(t.includes(w)) s+= w.length>4?2:1.2; }); if(s>0) scores[id]=s; });
  return scores;
}
function aiDetectFromPhotos(photos){
  let votes={};
  (photos||[]).forEach(f=>{ const meta=PHOTO_TAGS[f]||PHOTO_TAGS[Object.keys(PHOTO_TAGS).find(k=>f.includes(k))]; if(meta){ votes[meta.cat]=(votes[meta.cat]||0)+2; } });
  return votes;
}
function aiDetectCategory(title,desc,photos){
  const scores=aiDetectKeywords((title||'')+' '+(desc||''));
  const pv=aiDetectFromPhotos(photos); Object.keys(pv).forEach(c=>scores[c]=(scores[c]||0)+pv[c]);
  const arr=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);
  if(!arr.length) return {id:'gerais',confidence:55};
  const best=arr[0], second=arr[1];
  const confidence=Math.min(97, 58 + scores[best]*8 + (scores[best]-scores[second]||0)*4);
  return {id:best, confidence:Math.round(confidence)};
}
function aiComplexity(text,catId){
  const t=(text||'').toLowerCase(); let score=0;
  COMPLEX_WORDS.forEach(w=>{ if(t.includes(w)) score+=1; });
  // categoria estrutural pesa mais
  if(['eletrica','hidraulica','montagem'].includes(catId)) score+= (catId==='montagem'?1.2:1);
  const words=(t.trim().split(/\s+/).filter(Boolean).length);
  if(words>60) score+=1; if(words>120) score+=1;
  if(score>=4) return {level:'alta',label:'Alta',pct:88,color:'danger',desc:'Serviço que exige equipe/experiência e tempo maior.'};
  if(score>=2) return {level:'media',label:'Média',pct:60,color:'warn',desc:'Serviço padrão, boa parte das ferramentas é simples.'};
  return {level:'baixa',label:'Baixa',pct:30,color:'info',desc:'Serviço rápido e simples de executar.'};
}
function aiUrgency(text){
  const t=(text||'').toLowerCase(); let s=0;
  URGENT_WORDS.forEach(w=>{ if(t.includes(w)) s+=1; });
  if(s>=2) return {label:'Urgente',color:'danger',desc:'Recomendado atendimento imediato.'};
  if(s===1) return {label:'Atenção',color:'warn',desc:'Preferência por atendimento no dia.'};
  return {label:'Normal',color:'info',desc:'Sem urgência — pode agendar.'};
}
function aiExtractFields(title,desc,when){
  // estrutura tecnicamente a solicitação
  const t=(desc||'').toLowerCase();
  const rooms=(t.match(/(\w+)\s*(quartos|cômodos|banheiros)/)||[]);
  const size=(t.match(/(\d+)\s*(m²|metros)/i)||[]);
  const materials=/(comprei|já compr|material incluso|levo o material)/.test(t)?'Cliente/prestador define':'A combinar';
  return { size:size?size[1]+' '+size[2]:'N/D', rooms:rooms.length?rooms[0]+' '+rooms[2]:'N/D', materials };
}
function aiMissing(title,desc,address,when,photos){
  const m=[];
  if(!address || address.length<8) m.push('Endereço incompleto');
  if(!when || !when.trim()) m.push('Data/horário preferido');
  if(!desc || (desc||'').trim().length<25) m.push('Descrição muito curta — detalhe melhor o problema');
  if(!photos || !photos.length) m.push('Adicione fotos para diagnóstico mais preciso');
  if(!title || !title.trim()) m.push('Informe um título claro');
  return m;
}
function aiMatch(catId, complexity, urgency){
  // seleciona profissionais mais adequados (categoria + rating + experiência)
  const pros=Object.keys(PERSONAS).filter(id=>id.startsWith('pro'));
  return pros.map(id=>{
    const p=PERSONAS[id]; let s=30;
    if(p.cat===catId) s+=38; else if(p.cat==='gerais') s+=8;
    s+= (p.rating-4)*22;
    s+= Math.min(20, p.jobs*0.1);
    if(p.verified) s+=6;
    if(complexity.level==='alta' && p.jobs>120) s+=8;
    return {id,name:p.name,initials:p.initials,cat:p.cat,rating:p.rating,jobs:p.jobs,verified:p.verified,score:Math.round(s)};
  }).sort((a,b)=>b.score-a.score).filter(p=>p.score>60).slice(0,4);
}
function aiAnalyze(title,desc,address,when,photos){
  const catDet=aiDetectCategory(title,desc,photos);
  const cx=aiComplexity((title||'')+' '+(desc||''),catDet.id);
  const ur=aiUrgency((title||'')+' '+(desc||''));
  return {
    category:catDet, complexity:cx, urgency:ur,
    fields:aiExtractFields(title,desc,when), missing:aiMissing(title,desc,address,when,photos),
    matches:aiMatch(catDet.id,cx,ur),
    budget:AI_LANG[catDet.id]?AI_LANG[catDet.id].avg:150,
    confidence:catDet.confidence
  };
}

/* ---- comparação de propostas (IA recomenda a melhor) ---- */
function aiCompare(req){
  const props=req.proposals||[];
  return props.map(p=>{
    const pr=persona(p.proId);
    let s=50;
    s+= (pr.rating-4)*18;
    if(p.amount && req.budgetMin) s+= Math.max(-12, Math.min(14,(req.budgetMin-p.amount)*0.06));
    if(pr.verified) s+=8;
    if(p.status==='aceita') s+=40;
    return {p,pr,score:Math.round(s)};
  }).sort((a,b)=>b.score-a.score);
}
function aiBestProposal(req){
  const c=aiCompare(req);
  if(!c.length) return null;
  return c[0]; // melhor (exceto se já aceita, usa a aceita)
}

  $('#avatarRole').textContent=state.role==='cliente'?'cli':'pro';
  // notif panel
  const np=$('#notifPanel');
  if(np){
    const list=notifsFor();
    np.style.display=state.notifOpen?'block':'none';
    np.innerHTML='<div class="dd-head"><b>Notificações</b>'+(list.some(n=>!n.read)?'<button onclick="markAllRead()">Marcar lidas</button>':'')+'</div>'+
      '<div class="dd-scroll">'+(list.length?list.slice(0,20).map(n=>'<div class="notif'+(n.read?'':' unread')+'"><span class="ni">'+svg(n.icon)+'</span><div><p>'+esc(n.text)+'</p><time>'+esc(n.time)+'</time></div></div>').join(''):'<div class="dd-empty">'+svg('bell')+'<div style="margin-top:8px">Nenhuma notificação</div></div>')+'</div>';
  }
  // account menu
  const am=$('#accountMenu');
  if(am){
    am.style.display=state.accountOpen?'block':'none';
    const isPro=state.role==='pro';
    am.innerHTML=
      '<div class="dd-head"><b>'+esc(cur().name)+'</b><span style="color:var(--soft);font-size:11px">'+(isPro?'Profissional':'Cliente')+'</span></div>'+
      (isPro?'<div class="menuitem" onclick="nav(\'pverify\');state.accountOpen=false;"><span class="mi">'+svg('shield')+'</span>Meu perfil & verificação</div>'
           :'<div class="menuitem" onclick="nav(\'cprofile\');state.accountOpen=false;"><span class="mi">'+svg('user')+'</span>Meus dados</div>')+
      '<div class="menuitem" onclick="logout()"><span class="mi">'+svg('log')+'</span>Trocar de conta / sair</div>';
  }
}

function photoLabel(f){
  const key=Object.keys(PHOTO_TAGS).find(k=>f.includes(k));
  return key? PHOTO_TAGS[key].label : 'foto anexada';
}
function onPhotoPick(e){
  const files=[...e.target.files].slice(0,4);
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=()=>{ if(state.photos.length<4) state.photos.push(reader.result); render(); };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}

function removePhoto(i){ state.photos.splice(i,1); render(); }
function runAI(){
  const desc=$('#pubDesc').value.trim();
  const tit=desc.split('\n')[0].slice(0,60)||'Serviço';
  state.preDesc=desc;
  state.analyzing=true;
  $('#aiBtn') && ($('#aiBtn').innerHTML='<span class="analyzing"><span class="spinner"></span> Analisando...</span>');
  setTimeout(()=>{
    const ai=aiAnalyze(tit,desc,'', '', state.photos);
    state.aiResult=ai; state.analyzing=false; state.preTit=tit; render();
    toast('IA analisou o pedido · categoria '+cat(ai.category.id).name,'ai');
  },1400);
}
function aiAnalysisView(ai){
  const c=cat(ai.category.id);
  const cx=ai.complexity, ur=ai.urgency;
  return '<div class="ai-box">'+
    '<div class="ai-head"><span class="ai-badge">'+svg('ai')+'</span><div><b>Análise da IA</b><span>'+(ai.confidence||0)+'% confiança no diagnóstico</span></div></div>'+
    '<div class="ai-row">'+
      '<span class="ai-tag">'+svg(c.icon)+' '+esc(c.name)+'</span>'+
      '<span class="ai-tag '+cx.color+'">'+svg('tools')+' Complexidade '+cx.label+'</span>'+
      '<span class="ai-tag '+ur.color+'">'+svg('clock')+' Urgência: '+ur.label+'</span>'+
    '</div>'+
    '<div class="ai-fields">'+
      '<div class="ai-field"><small>Detectado</small><b>'+esc(c.name)+'</b></div>'+
      '<div class="ai-field"><small>Tamanho / medida</small><b>'+esc(ai.fields.size)+'</b></div>'+
      '<div class="ai-field"><small>Material</small><b>'+esc(ai.fields.materials)+'</b></div>'+
      '<div class="ai-field"><small>Faixa sugerida</small><b>'+money(ai.budget)+'</b></div>'+
    '</div>'+
    '<div class="ai-field missing" style="margin-bottom:12px"><small>Informações a complementar</small><b>'+(ai.missing.length?ai.missing.join(' · '):'Nada — pedido completo')+'</b></div>'+
    '<p class="ai-note"><b>'+svg('brain')+' O que a IA entendeu:</b> '+cx.desc+' '+ur.desc+' Categorizei como '+c.name.toLowerCase()+' e vou encaminhar aos profissionais mais adequados.</p>'+
    '<div class="ai-sm" style="margin-top:14px"><b style="font-size:14px">Profissionais selecionados para este pedido</b>'+
      ai.matches.map(m=>'<div class="ai-match"><span class="mpa">'+m.initials+'</span><div><b>'+esc(m.name)+'</b><span>'+esc(cat(m.cat).name)+' · ★ '+m.rating+' · '+m.jobs+' serviços</span></div><div class="score"><b>'+m.score+'%</b><small>compatível</small></div></div>').join('')+
    '</div>'+
  '</div>';
}
function publishRequest(){
  const desc=$('#pubDesc').value.trim();
  const ai=state.aiResult||{category:{id:state.catFilter||'gerais',confidence:70},complexity:{label:'Média',color:'warn',pct:60},urgency:{label:'Normal',color:'info'},missing:[],matches:[],budget:150};
  const tit=state.preTit||desc.split('\n')[0].slice(0,60)||'Serviço';
  const addr=$('#pubAddr')?$('#pubAddr').value.trim():'Av. Paulista, 1578 · Bela Vista, '+CITY;
  const when=$('#pubWhen')?$('#pubWhen').value:'A combinar';
  const budget=$('#pubBudget')?$('#pubBudget').value:'0';
  const catId=ai.category.id;
  const id='mr'+Date.now();
  const r={id:id,clientId:'cli-marina',cat:catId,status:'aguardando',title:tit,desc:desc,address:addr||'Endereço a definir',when:when,budgetMin:+budget||0,budget:budget==='0'?'A combinar':'Até '+money(budget),createdAt:Date.now(),acceptedPro:null,proposals:[],ai:ai,photos:state.photos.slice()};
  REQS.unshift(r);
  state.photos=[];state.aiResult=null;state.preDesc='';state.preTit='';
  toast('Pedido publicado! Enviado para '+ai.matches.length+' profissionais.','send');
  nav('crequest',{context:id});
  setTimeout(()=>simulateProposals(id),5000);
}

function vClientRequestsAll(){
  return '<div class="backbar"><button onclick="goBack()">'+svg('chevL')+'</button><div><h2>Meus pedidos</h2></div></div>'+vClientRequestsList(REQS.filter(r=>r.clientId==='cli-marina'))+
  '<div style="margin-top:16px"><button class="btn lime block" onclick="nav(\'cpublish\')">'+svg('plus')+' Publicar novo pedido</button></div>';
}
function vClientRequestsList(list){
  if(!list.length)return '<div class="empty">'+svg('box')+'<b>Nenhum pedido ainda</b>Publique o primeiro e receba propostas.</div>';
  return list.map(r=>{const c=cat(r.cat);
    return '<div class="reqitem" onclick="nav(\'crequest\',{context:\''+r.id+'\'})" style="cursor:pointer">'+
      '<div class="top"><span class="cat">'+svg(c.icon)+' '+esc(c.name)+'</span><span class="badge-status '+r.status+'">'+reqStatusLabel(r.status)+'</span></div>'+
      '<h3>'+esc(r.title)+'</h3><div class="desc">'+esc(r.desc)+'</div>'+
      '<div class="meta"><span>'+svg('pin')+' '+esc(r.address)+'</span><span>'+svg('clock')+' '+esc(r.when)+'</span><span>'+svg('money')+' '+esc(r.budget)+'</span></div>'+
      (r.status==='aguardando'?'<div style="margin-top:10px;font-size:13px;color:var(--muted)">'+(r.proposals.length?r.proposals.length+' proposta(s) recebida(s) 🎉':'Ainda sem propostas')+'</div>':'')+
    '</div>';}).join('');
}
function vRequest(r){
  const c=cat(r.cat);
  const ai=r.ai||aiAnalyze(r.title,r.desc,r.address,r.when,r.photos||[]);
  const cmp=aiCompare(r);
  const best=cmp[0];
  return '<div class="backbar"><button onclick="goBack()">'+svg('chevL')+'</button><div><h2>Detalhe do pedido</h2></div></div>'+
  '<div class="panel"><h3>'+esc(r.title)+'</h3>'+
    '<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap"><span class="cat" style="display:inline-flex;align-items:center;gap:6px;background:var(--lime-soft);border:1px solid var(--line);color:var(--lime);font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px">'+svg(c.icon)+' '+esc(c.name)+'</span><span class="badge-status '+r.status+'">'+reqStatusLabel(r.status)+'</span></div>'+
    (r.photos&&r.photos.length?'<div class="ph-grid" style="grid-template-columns:repeat(3,1fr)">'+r.photos.slice(0,3).map(f=>'<div class="ph" style="aspect-ratio:16/10"><img src="'+f+'"></div>').join('')+'</div>':'')+
    '<div class="desc" style="color:var(--muted);font-size:14.5px;margin-bottom:14px;margin-top:10px">'+esc(r.desc)+'</div>'+
    '<div class="meta" style="display:flex;gap:16px;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap"><span>'+svg('pin')+' '+esc(r.address)+'</span><span>'+svg('clock')+' '+esc(r.when)+'</span><span>'+svg('money')+' '+esc(r.budget)+'</span></div>'+
    '<div class="ai-row" style="margin-top:12px">'+
      '<span class="ai-tag">'+svg('ai')+' IA: '+c.name+' · '+ai.confidence+'%</span>'+
      '<span class="ai-tag '+ai.complexity.color+'">'+svg('tools')+' '+ai.complexity.label+'</span>'+
      '<span class="ai-tag '+ai.urgency.color+'">'+svg('clock')+' '+ai.urgency.label+'</span>'+
    '</div>'+
  '</div>'+
  (r.status==='em_andamento'? vJobInProgress(r) :
   r.status==='concluida'? vJobConcluded(r) :
   '<div class="panel"><h3>Propostas recebidas ('+r.proposals.length+')</h3>'+
     (r.proposals.length?
       (r.proposals.length>1?'<div class="ai-box" style="padding:14px;margin-bottom:12px"><div class="ai-head"><span class="ai-badge">'+svg('target')+'</span><div><b>Comparação da IA</b><span>Analisou '+r.proposals.length+' propostas</span></div></div>'+
         cmp.map(x=>'<div class="ai-match"><span class="mpa">'+x.pr.initials+'</span><div><b>'+esc(x.pr.name)+'</b><span>★ '+x.pr.rating+' · '+x.pr.jobs+' serviços</span></div><div class="score"><b>'+x.score+'%</b><small>'+(x===best?'recomendada':'')+'</small></div></div>').join('')+
         '<p class="ai-note" style="margin-top:6px">A IA recomenda a proposta de <b>'+esc(best.pr.name)+'</b> pelo melhor equilíbrio entre preço, avaliação e histórico.</p></div>':'')+
       r.proposals.map(p=>proposalItem(r,p)).join('') :
      '<div class="empty" style="padding:36px 12px">'+svg('clock')+'<b>Nenhuma proposta ainda</b>Profissionais estão sendo notificados. Assim que enviarem, aparecem aqui.</div>')+'</div>');
}
function vJobInProgress(r){
  const p=persona(r.acceptedPro);const amount=r.proposals.find(x=>x.proId===r.acceptedPro).amount;
  return '<div class="panel" style="border-color:var(--info);background:rgba(84,169,255,.05)"><h3>Em andamento</h3>'+
    '<div class="prop" style="border-color:var(--info)"><span class="pa">'+p.initials+'</span><div class="info"><b>'+esc(p.name)+'</b><div class="row"><span class="st">'+svg('star')+' '+p.rating+'</span><span>'+p.jobs+' serviços · '+esc(p.loc)+'</span></div></div><div class="amount">'+money(amount)+'</div></div>'+
    '<div style="display:flex;gap:10px;margin-top:6px">'+
      '<button class="btn lime" style="flex:1" onclick="openChat(\''+r.acceptedPro+'\',\''+r.id+'\')">'+svg('message')+' Conversar</button>'+
      '<button class="btn outline-lime" style="flex:1" onclick="openCheckout(\''+r.id+'\')">'+svg('money')+' Concluir & pagar</button>'+
    '</div>'+
    '<p style="font-size:12px;color:var(--soft);margin-top:10px;text-align:center">Após o serviço, confirme a conclusão e pague com segurança pela plataforma.</p>'+
  '</div>';

function schedulePartnerReply(partner){
  if(replyPending.has(partner))return;replyPending.add(partner);
  setTimeout(()=>{replyPending.delete(partner);
    const replies=['👍 Combinado!','Perfeito, então está certo.','Pode deixar comigo.','Certo, qualquer coisa te aviso aqui.','Fechado! Obrigado 😊'];
    const r=replies[Math.floor(Math.random()*replies.length)];
    getThread(partner,cur().id).push({from:partner,text:r,time:timeNow(),unread:true});
    if(state.view==='chatroom'&&state.chatPartner===partner){render();scrollChat();}else{pushNotif(state.user, persona(partner).name.split(' ')[0]+' respondeu.', 'message');}
  },1800+Math.random()*1200);
}

  nav('crequest',{context:r.id});

function simulateProposals(reqId){
  const r=REQS.find(x=>x.id===reqId);if(!r||r.acceptedPro)return;
  // prioriza profissionais selecionados pela IA; senão cai em um pool da categoria
  let pool;
  if(r.ai && r.ai.matches && r.ai.matches.length){ pool=r.ai.matches.map(m=>m.id).filter(id=>id!=='pro-marcos').slice(0,2); }
  if(!pool || !pool.length){ pool=(r.cat==='limpeza')?['pro-eduardo','pro-carla']:['pro-renato','pro-eduardo']; }
  pool=pool.slice(0,2);
  pool.forEach((pId,i)=>{
    const amt=Math.max(80,Math.round((r.budgetMin||AI_LANG[r.cat]?.avg||150)*0.88/10)*10+i*22);
    const msg='Olá! Analisei seu pedido e tenho disponibilidade '+r.when.toLowerCase()+'. Inclui material e garantia. Podemos conversar?';
    r.proposals.push({proId:pId,amount:amt,message:msg,status:'aguardando',aiScore:0});
  });
  // comparação IA
  const cmp=aiCompare(r);
  r.ai.cmp=cmp.map(x=>({id:x.p.proId,score:x.score}));
  const names=pool.map(id=>persona(id).name.split(' ')[0]).join(' e ');
  pushNotif('cli-marina',names+' enviaram proposta para "'+r.title+'". A IA compara os orçamentos.','send');
  toast(names+' enviaram propostas! A IA já comparou os orçamentos.','sparks');
}

function render(){
  const c=$('#content');
  if(!state.user){ c.className='content no-nav'; c.innerHTML=vLogin(); $('#bottomnav').innerHTML=''; $('#roleSwitch').innerHTML=''; $('#notifPanel').style.display='none'; $('#accountMenu').style.display='none'; $('#bellBtn').innerHTML=svg('bell'); $('#avatarIn').textContent=''; $('#avatarRole').textContent=''; $('#topEmblem').innerHTML=emblem(); window.scrollTo(0,0); return; }
  c.className='content';
  let html='';
  const role=state.role;
  if(role==='cliente'){
    switch(state.view){
      case 'chome':html=vChome();break;
      case 'cpublish':html=vCublish();break;
      case 'crequests':html=vClientRequestsAll();break;
      case 'crequest':{const r=REQS.find(x=>x.id===state.context);html=r?vRequest(r):vClientRequestsAll();}break;
      case 'cchat':html='<div class="backbar"><button onclick="goBack()">'+svg('chevL')+'</button><div><h2>Conversas</h2></div></div>'+vChatList();break;
      case 'cprofile':html=vClientProfile();break;
      case 'chatroom':html=vChatRoom();break;
      default:html=vChome();
    }
  }else{
    switch(state.view){
      case 'phome':html=vPhome();break;
      case 'pcentral':html=vPcentral();break;
      case 'pproposals':html=vProposalsAll();break;
      case 'pverify':html=vVerify();break;
      case 'pchat':html='<div class="backbar"><button onclick="goBack()">'+svg('chevL')+'</button><div><h2>Conversas</h2></div></div>'+vChatList();break;
      case 'chatroom':html=vChatRoom();break;
      default:html=vPhome();
    }
  }
  c.innerHTML=html;
  $('#topEmblem').innerHTML=emblem();
  $('#roleSwitch').innerHTML='<button class="'+(role==='cliente'?'active':'')+'" onclick="switchRole(\'cliente\')">'+svg('user')+' Cliente</button><button class="'+(role==='pro'?'active':'')+'" onclick="switchRole(\'pro\')">'+svg('award')+' Profissional</button>';
  const nav=ROLE_NAV[role];let activeNav=state.view;
  if(state.view==='chatroom')activeNav=role==='cliente'?'cchat':'pchat';
  else if(state.view==='crequest')activeNav='crequests';
  else if(state.view==='cprofile')activeNav='chome';
  else if(state.view==='pverify')activeNav='phome';
  const chatUnread=state.role==='cliente'?unreadForChat('cchat'):unreadForChat('pchat');
  $('#bottomnav').innerHTML=nav.map(n=>'<button class="'+(n.id===activeNav?'active':'')+'" onclick="nav(\''+n.id+'\')">'+svg(n.icon)+'<span>'+n.label+'</span>'+(n.id==='cchat'||n.id==='pchat'?(chatUnread?'<span class="bdg">'+chatUnread+'</span>':''):'')+'</button>').join('');
  if(state.view==='chome'){const s=$('#cliSearch');if(s)s.addEventListener('keydown',e=>{if(e.key==='Enter')searchCli();});}
  scrollChat();window.scrollTo(0,0);
  renderChromiums();
}
function unreadForChat(){const me=cur().id;let un=0;Object.keys(CHATS).forEach(k=>{const arr=CHATS[k];if(!arr.length)return;const p=k.split('__');if(!p.includes(me))return;const last=arr[arr.length-1];if(last.from!==me&&last.unread)un++;});return un;}
